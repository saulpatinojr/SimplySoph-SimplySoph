# ────────────────────────────────────────────────────────────────────────────────
# SimplySoph — CI/CD Pipeline
# ────────────────────────────────────────────────────────────────────────────────
# Triggers:
#   push to main   → build + deploy hosting, functions, and security policies
#   pull_request   → build + deploy preview channel + post URL as PR comment
#
# Authentication: GitHub OIDC → GCP Workload Identity Federation. No service
# account JSON keys, no PATs. Infra lives in platform/terraform (TFC workspace
# hcw/SimplySoph).
#
# Required GitHub repository VARIABLES (not secrets — these are identifiers):
#   GCP_WORKLOAD_IDENTITY_PROVIDER — full WIF provider resource name
#   GCP_SERVICE_ACCOUNT            — github-deploy@…iam.gserviceaccount.com
#   VITE_OWNER_FIREBASE_UID        — public owner UID baked into the client
#   VITE_ALGOLIA_APP_ID / VITE_ALGOLIA_SEARCH_KEY / VITE_ALGOLIA_INDEX_NAME
#                                  — public search-only Algolia config
#
# The Firebase web config (apiKey etc.) is PUBLIC and fetched at build time
# via `firebase apps:sdkconfig` — it is not stored in GitHub at all.
# Runtime secrets live in GCP Secret Manager, bound via defineSecret().
# ────────────────────────────────────────────────────────────────────────────────
name: 🚀 Build & Deploy — SimplySoph

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege GITHUB_TOKEN. id-token: write is granted per-job for the
# OIDC exchange with GCP.
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  FIREBASE_PROJECT: simplysoph-66c78

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1: Lint, type-check, test, build
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: 🔨 Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # OIDC exchange to fetch the public Firebase web config

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚡ Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📦 Install Functions dependencies
        run: npm ci --prefix functions

      - name: 🧪 Firestore + Storage rules tests
        run: npm run test:rules

      - name: 🧹 Type-check
        run: npm run typecheck

      - name: 🔗 Internal route crawl
        run: npm run test:links

      - name: 🔧 Build Functions
        run: npm run functions:build

      - name: ✅ Unit tests
        run: npm run test

      - name: 🔑 Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: 🌐 Fetch public Firebase web config
        shell: bash
        run: |
          npx firebase-tools apps:sdkconfig web --project "$FIREBASE_PROJECT" --json \
            | jq -r '.result.sdkConfig' > "$RUNNER_TEMP/web-config.json"
          {
            echo "VITE_FIREBASE_API_KEY=$(jq -r '.apiKey' "$RUNNER_TEMP/web-config.json")"
            echo "VITE_FIREBASE_AUTH_DOMAIN=$(jq -r '.authDomain' "$RUNNER_TEMP/web-config.json")"
            echo "VITE_FIREBASE_PROJECT_ID=$(jq -r '.projectId' "$RUNNER_TEMP/web-config.json")"
            echo "VITE_FIREBASE_STORAGE_BUCKET=$(jq -r '.storageBucket' "$RUNNER_TEMP/web-config.json")"
            echo "VITE_FIREBASE_MESSAGING_SENDER_ID=$(jq -r '.messagingSenderId' "$RUNNER_TEMP/web-config.json")"
            echo "VITE_FIREBASE_APP_ID=$(jq -r '.appId' "$RUNNER_TEMP/web-config.json")"
            echo "VITE_FIREBASE_MEASUREMENT_ID=$(jq -r '.measurementId // empty' "$RUNNER_TEMP/web-config.json")"
          } >> "$GITHUB_ENV"

      - name: 🏗️ Build
        run: npm run build
        env:
          VITE_APP_TITLE:                 SimplySoph
          VITE_OWNER_FIREBASE_UID:        ${{ vars.VITE_OWNER_FIREBASE_UID }}
          VITE_ALGOLIA_APP_ID:            ${{ vars.VITE_ALGOLIA_APP_ID }}
          VITE_ALGOLIA_SEARCH_KEY:        ${{ vars.VITE_ALGOLIA_SEARCH_KEY }}
          VITE_ALGOLIA_INDEX_NAME:        ${{ vars.VITE_ALGOLIA_INDEX_NAME }}
          VITE_ENABLE_REALTIME_FEED:      'true'
          VITE_FIREBASE_FUNCTIONS_REGION: us-central1

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2a: Deploy to production (main branch only)
  # ───────────────────────────────────────────────────────────────────────────
  deploy-production:
    name: 🌍 Deploy → Production
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://simplysoph-66c78.web.app

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📤 Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: 🔑 Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: ☁️ Deploy to Firebase Hosting
        run: npx --yes firebase-tools@13 deploy --only hosting --project "$FIREBASE_PROJECT"

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2b: Deploy preview channel (pull requests only)
  # ───────────────────────────────────────────────────────────────────────────
  deploy-preview:
    name: 👁️ Deploy → Preview
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      pull-requests: write # posts the preview URL as a PR comment
    if: github.event_name == 'pull_request'

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📤 Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: 🔑 Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: 🔮 Deploy preview channel
        id: preview
        shell: bash
        run: |
          npx --yes firebase-tools@13 hosting:channel:deploy "pr${{ github.event.number }}" \
            --project "$FIREBASE_PROJECT" --expires 7d --json > channel.json
          echo "url=$(jq -r '.result | to_entries[0].value.url' channel.json)" >> "$GITHUB_OUTPUT"

      - name: 💬 Comment preview URL on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          gh pr comment "${{ github.event.number }}" \
            --repo "${{ github.repository }}" \
            --body "🔮 Preview channel deployed: $PREVIEW_URL (expires in 7 days)"

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3: Deploy Cloud Functions + Firebase security policies (main only).
  # Functions deploy FIRST: the security rules assume the /api routes exist
  # (comments, newsletter, contact all write through the api function).
  # ───────────────────────────────────────────────────────────────────────────
  deploy-backend:
    name: 🔒 Deploy Functions + Firebase Policies
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚡ Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📦 Install Functions dependencies
        run: npm ci --prefix functions

      - name: 🔑 Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: ⚙️ Deploy Cloud Functions
        run: npx firebase-tools deploy --only functions --project "$FIREBASE_PROJECT" --force

      - name: 🔒 Deploy Firestore + Storage policies
        run: npx firebase-tools deploy --only firestore:rules,firestore:indexes,storage --project "$FIREBASE_PROJECT"
