# ────────────────────────────────────────────────────────────────────────────────
# SimplySoph — CI/CD Pipeline
# ────────────────────────────────────────────────────────────────────────────────
# Triggers:
#   push to main   → build + deploy to Firebase Hosting (production)
#   pull_request   → build + deploy preview channel + post URL as PR comment
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT_SIMPLYSOPH_66C78 — Firebase service account JSON
#   VITE_FIREBASE_API_KEY
#   VITE_FIREBASE_AUTH_DOMAIN
#   VITE_FIREBASE_PROJECT_ID
#   VITE_FIREBASE_STORAGE_BUCKET
#   VITE_FIREBASE_MESSAGING_SENDER_ID
#   VITE_FIREBASE_APP_ID
#   VITE_FIREBASE_MEASUREMENT_ID
#   VITE_OWNER_FIREBASE_UID
#   VITE_ALGOLIA_APP_ID          — Algolia application ID (public)
#   VITE_ALGOLIA_SEARCH_KEY      — Algolia SEARCH-ONLY key (never the admin key)
#   VITE_ALGOLIA_INDEX_NAME      — Algolia index name (e.g. prod_content)
# ────────────────────────────────────────────────────────────────────────────────
name: 🚀 Build & Deploy — SimplySoph

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege GITHUB_TOKEN: cloud auth uses the Firebase service-account
# secret (WIF migration planned in docs/SECRETS_MIGRATION_PLAN.md), so the
# workflow itself only needs to read the repo.
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  FIREBASE_PROJECT: simplysoph-66c78

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1: Lint, type-check, build
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: 🔨 Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚡ Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📦 Install Functions dependencies
        run: npm ci --prefix functions

      - name: 🧪 Firestore + Storage rules tests
        run: npm run test:rules

      - name: 🧹 Type-check
        run: npm run typecheck

      - name: 🔗 Internal route crawl
        run: npm run test:links

      - name: 🔧 Build Functions
        run: npm run functions:build

      - name: ✅ Unit tests
        run: npm run test

      - name: 🏗️ Build
        run: npm run build
        env:
          VITE_APP_TITLE:                   SimplySoph
          VITE_FIREBASE_API_KEY:            ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN:        ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID:         ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET:     ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID:             ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID:     ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_OWNER_FIREBASE_UID:          ${{ secrets.VITE_OWNER_FIREBASE_UID }}
          VITE_ALGOLIA_APP_ID:              ${{ secrets.VITE_ALGOLIA_APP_ID }}
          VITE_ALGOLIA_SEARCH_KEY:          ${{ secrets.VITE_ALGOLIA_SEARCH_KEY }}
          VITE_ALGOLIA_INDEX_NAME:          ${{ secrets.VITE_ALGOLIA_INDEX_NAME }}
          VITE_ENABLE_REALTIME_FEED:        'true'
          VITE_FIREBASE_FUNCTIONS_REGION:   us-central1

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2a: Deploy to production (main branch only)
  # ───────────────────────────────────────────────────────────────────────────
  deploy-production:
    name: 🌍 Deploy → Production
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # action-hosting-deploy posts a deployment check run via repoToken
    permissions:
      contents: read
      checks: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://simplysoph-66c78.web.app

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📤 Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: ☁️ Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken:         ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SIMPLYSOPH_66C78 }}
          projectId:         ${{ env.FIREBASE_PROJECT }}
          channelId:         live

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2b: Deploy preview channel (pull requests only)
  # ───────────────────────────────────────────────────────────────────────────
  deploy-preview:
    name: 👁️ Deploy → Preview
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # action-hosting-deploy posts the preview URL as a PR comment/check
    permissions:
      contents: read
      checks: write
      pull-requests: write
    if: github.event_name == 'pull_request'

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📤 Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: 🔮 Deploy preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken:         ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SIMPLYSOPH_66C78 }}
          projectId:         ${{ env.FIREBASE_PROJECT }}
          expires:           7d
          # Preview URL is automatically posted as a PR comment by the action

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3: Deploy Cloud Functions + Firebase security policies (main only).
  # Functions deploy FIRST: the security rules assume the /api routes exist
  # (comments, newsletter, contact all write through the api function).
  # ───────────────────────────────────────────────────────────────────────────
  deploy-backend:
    name: 🔒 Deploy Functions + Firebase Policies
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚡ Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📦 Install Functions dependencies
        run: npm ci --prefix functions

      - name: 🔐 Configure Firebase service account credentials
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/firebase-service-account.json" <<'EOF'
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SIMPLYSOPH_66C78 }}
          EOF
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      # TEMPORARY DIAGNOSTIC: print the deploy identity (uppercased so the
      # secret masker doesn't redact it). Remove once CI functions deploy works.
      - name: 🔎 Show deploy identity
        shell: bash
        run: |
          jq -r '.client_email // "NO client_email FIELD"' "$GOOGLE_APPLICATION_CREDENTIALS" | tr '[:lower:]' '[:upper:]'
          jq -r '.project_id // "NO project_id FIELD"' "$GOOGLE_APPLICATION_CREDENTIALS" | tr '[:lower:]' '[:upper:]'
          jq -r '.type // "NO type FIELD"' "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: ⚙️ Deploy Cloud Functions
        run: |
          npx firebase-tools deploy --only functions --project ${{ env.FIREBASE_PROJECT }} --force

      - name: 🔒 Deploy Firestore + Storage policies
        run: |
          npx firebase-tools deploy --only firestore:rules,firestore:indexes,storage --project ${{ env.FIREBASE_PROJECT }}
