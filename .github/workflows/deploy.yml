# ────────────────────────────────────────────────────────────────────────────────
# SimplySoph — CI/CD Pipeline
# ────────────────────────────────────────────────────────────────────────────────
# Triggers:
#   push to main   → build + deploy to Firebase Hosting (production)
#   pull_request   → build + deploy preview channel + post URL as PR comment
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   FIREBASE_TOKEN              — from: firebase login:ci
#   VITE_FIREBASE_API_KEY
#   VITE_FIREBASE_AUTH_DOMAIN
#   VITE_FIREBASE_PROJECT_ID
#   VITE_FIREBASE_STORAGE_BUCKET
#   VITE_FIREBASE_MESSAGING_SENDER_ID
#   VITE_FIREBASE_APP_ID
#   VITE_FIREBASE_MEASUREMENT_ID
#   VITE_OWNER_FIREBASE_UID
#   VITE_EMAILJS_SERVICE_ID
#   VITE_EMAILJS_TEMPLATE_ID
#   VITE_EMAILJS_PUBLIC_KEY
# ────────────────────────────────────────────────────────────────────────────────
name: 🚀 Build & Deploy — SimplySoph

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  FIREBASE_PROJECT: simplysoph-66c78

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1: Lint, type-check, build
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: 🔨 Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚡ Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧹 Type-check
        run: npm run typecheck --if-present || npx tsc --noEmit
        working-directory: client
        continue-on-error: true   # Warn but don’t block deploy

      - name: 🏗️ Build
        run: npm run build
        env:
          VITE_APP_TITLE:                   SimplySoph
          VITE_FIREBASE_API_KEY:            ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN:        ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID:         ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET:     ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID:             ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID:     ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_OWNER_FIREBASE_UID:          ${{ secrets.VITE_OWNER_FIREBASE_UID }}
          VITE_EMAILJS_SERVICE_ID:          ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID:         ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY:          ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_ENABLE_REALTIME_FEED:        'true'
          VITE_FIREBASE_FUNCTIONS_REGION:   us-central1

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2a: Deploy to production (main branch only)
  # ───────────────────────────────────────────────────────────────────────────
  deploy-production:
    name: 🌍 Deploy → Production
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://simplysoph-66c78.web.app

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📤 Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: ☁️ Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken:         ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId:         ${{ env.FIREBASE_PROJECT }}
          channelId:         live

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2b: Deploy preview channel (pull requests only)
  # ───────────────────────────────────────────────────────────────────────────
  deploy-preview:
    name: 👁️ Deploy → Preview
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📤 Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: 🔮 Deploy preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken:         ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId:         ${{ env.FIREBASE_PROJECT }}
          expires:           7d
          # Preview URL is automatically posted as a PR comment by the action

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3: Deploy Firestore rules (main branch only)
  # ───────────────────────────────────────────────────────────────────────────
  deploy-rules:
    name: 🔒 Deploy Firestore Rules
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☁️ Deploy Firestore rules
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken:         ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId:         ${{ env.FIREBASE_PROJECT }}
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
        # Override entrypoint to deploy only rules
      - name: 🔒 Firebase deploy rules only
        run: |
          npm install -g firebase-tools
          firebase deploy --only firestore:rules --project ${{ env.FIREBASE_PROJECT }} --token ${{ secrets.FIREBASE_TOKEN }}
